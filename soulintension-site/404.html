<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>page not found | soulintension</title>
  <link rel="icon" type="image/webp" href="/images/soulintension_fav.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #ffffff;
      --heading: #555555;
      --body: #666666;
      --light-text: #999999;
      --border: #e0e0e0;
      --brand: #7a6e8a;
      --sans: 'Poppins', system-ui, sans-serif;
    }
    body {
      background: var(--white);
      color: var(--body);
      font-family: var(--sans);
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo { margin-bottom: 3rem; }
    .logo img { height: 40px; }
    h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    p {
      font-size: 1rem;
      color: var(--body);
      line-height: 1.85;
      max-width: 420px;
      margin: 0 auto 2rem;
    }
    .btn {
      display: inline-block;
      border: 1.5px solid var(--heading);
      color: var(--heading);
      background: transparent;
      padding: 0.85rem 2rem;
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: lowercase;
      text-decoration: none;
      transition: all 0.2s;
      margin: 0 0.5rem 0.5rem;
    }
    .btn:hover { background: var(--heading); color: var(--white); }
    .error-code {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--light-text);
      font-weight: 600;
      margin-bottom: 1rem;
      display: block;
    }
  </style>

  <!-- ACCESSIBILITY: focus styles and keyboard navigation -->
  <style>
    /* Visible focus indicator for keyboard navigation */
    *:focus-visible {
      outline: 3px solid #7a6e8a;
      outline-offset: 3px;
    }

    /* Remove outline for mouse users, keep for keyboard */
    *:focus:not(:focus-visible) {
      outline: none;
    }

    /* Ensure sufficient color contrast on links */
    a:hover { text-decoration: underline; }

    /* High contrast mode support */
    @media (forced-colors: active) {
      .btn, button { border: 2px solid ButtonText; }
      nav { border-bottom: 1px solid ButtonText; }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script>
    // Hamburger menu keyboard toggle
    document.addEventListener('DOMContentLoaded', function() {
      var hamburger = document.querySelector('.hamburger');
      var navLinks = document.getElementById('nav-links');
      if (hamburger && navLinks) {
        hamburger.addEventListener('click', function() {
          var expanded = hamburger.getAttribute('aria-expanded') === 'true';
          hamburger.setAttribute('aria-expanded', !expanded);
          navLinks.style.display = expanded ? 'none' : 'flex';
          navLinks.style.flexDirection = 'column';
          navLinks.style.position = 'absolute';
          navLinks.style.top = '100%';
          navLinks.style.left = '0';
          navLinks.style.right = '0';
          navLinks.style.background = '#fff';
          navLinks.style.padding = '1rem 1.5rem';
          navLinks.style.borderBottom = '1px solid #e0e0e0';
          navLinks.style.gap = '0.75rem';
        });
      }
    });
  </script>
</head>
<body>
  <a href="#main-content" style="position:absolute;top:-100px;left:0;background:#555555;color:#ffffff;padding:0.75rem 1.5rem;font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:500;z-index:10000;text-decoration:none;border:none;" onfocus="this.style.top='0'" onblur="this.style.top='-100px'">skip to main content</a>
  <div class="logo">
    <a href="/"><img src="/images/soulintensionlogo.png" alt="soulintension" /></a>
  </div>
  <span class="error-code">404 — page not found</span>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for may have moved or the link might be wrong. Here are a few places to start:</p>
  <div>
    <a href="/" class="btn">home</a>
    <a href="/about" class="btn">about</a>
    <a href="/community" class="btn">community</a>
    <a href="/connect" class="btn">connect</a>
  </div>
</body>
</html>
